<!doctype html>
<html lang="uk" data-theme="abi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="merchant-helper.ico">
<title>ABI: Merchant Helper</title>
<link rel="stylesheet" href="lib/daisyui/daisyui.css">
<link rel="stylesheet" href="lib/daisyui/abi-theme.css">
<style>
  /* Controls are daisyUI components (btn, select, input, checkbox, range, card); below is layout and the app's own parts. */
  :root {
    --bg: var(--color-base-100); --panel: var(--color-base-200); --line: var(--color-base-300); --text: var(--color-base-content); --muted: var(--abi-muted);
    --fs-s: 12px; --fs-m: 14px; --fs-l: 18px; --fs-xl: 28px; /* the only four text sizes */
    --accent: var(--color-primary); --ok: var(--color-success); --bad: var(--color-error);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-m)/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: var(--fs-l); }
  header .state { color: var(--muted); }
  header .spacer { flex: 1; align-self: stretch; }
  #viewSetup .fieldset { padding: 0; }
  #viewSetup .label { white-space: normal; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  /* top: result on the left (stays in place when scrolling), map on the right in its own box */
  .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px 0; align-items: start; }
  .top .result-col { position: sticky; top: 8px; }
  .map-wrap { max-height: calc(100vh - 150px); overflow: auto; }
  @media (max-width: 960px) { .top { grid-template-columns: 1fr; } .top .result-col { position: static; } }
  section.card { background: var(--panel); padding: 16px; margin-bottom: 16px; display: block; }
  section h2 { margin: 0 0 10px; font-size: var(--fs-m); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .select, .input { width: auto; }
  [hidden] { display: none !important; }
  label { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  canvas { width: 100%; display: block; background: var(--color-base-100); border-radius: var(--radius-box); }
  #screen { cursor: crosshair; }
  #map:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  #map { cursor: pointer; width: auto; max-width: 100%; margin: 0 auto; }
  .muted { color: var(--muted); }
  .help li { margin-bottom: 6px; }
  .range { width: 140px; }
  #log { max-height: 180px; overflow: auto; font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }

  .stage { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--accent); border-radius: var(--radius-box); background: color-mix(in oklab, var(--color-primary) 6%, transparent); margin-bottom: 12px; }
  .stage .title { font-size: var(--fs-l); font-weight: 700; color: var(--accent); }
  .stage .grow { flex: 1; }

  /* Result */
  #result { border-radius: var(--radius-box); padding: 16px; background: var(--color-base-100); border: 1px solid var(--line); min-height: 150px; transition: border-color .15s, background .15s; }
  #result .big { font-size: var(--fs-xl); font-weight: 800; line-height: 1.1; }
  .chance { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border: 1px solid; border-radius: var(--radius-box); margin: 12px 0; }
  .chance b { font-size: var(--fs-l); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tile { background: var(--color-base-200); border: 1px solid var(--line); border-radius: var(--radius-box); padding: 8px 6px 6px; text-align: center; }
  .tile img { width: 72px; height: 72px; object-fit: contain; display: block; margin: 0 auto; }
  .tile .noimg { height: 72px; display: flex; align-items: center; justify-content: center; font-size: var(--fs-s); color: var(--muted); }
  .tile i { display: block; height: 3px; border-radius: var(--radius-box); margin: 6px 10px; }
  .tile b { font-size: var(--fs-m); font-variant-numeric: tabular-nums; }

  /* payback and the best buys */
  .payback { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-box); margin: 0 0 12px; font-size: var(--fs-m); }
  .payback .verdict { font-weight: 700; padding: 1px 8px; border-radius: var(--radius-box); color: var(--color-primary-content); }
  .buy-opts { margin: 10px 0 0; font-size: var(--fs-s); }
  #bestBuys .best { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid color-mix(in oklab, var(--color-base-content) 4%, transparent); font-size: var(--fs-m); }
  #bestBuys .rank { flex: none; width: 26px; text-align: center; border-radius: var(--radius-selector); background: var(--accent); color: var(--color-primary-content); font-weight: 700; }
  #bestBuys h3, #session h3 { margin: 10px 0 4px; font-size: var(--fs-s); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #session { font-size: var(--fs-m); }
  #session h3 button { margin-left: 8px; text-transform: none; letter-spacing: 0; }
  /* overlay window (one monitor): the result card and the map float above the game */
  .overlay { padding: 8px; }
  .overlay #result { padding: 10px; min-height: 0; }
  .overlay #result .big { font-size: var(--fs-xl); }
  .overlay .tiles { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
  .overlay .tile img { width: 48px; height: 48px; }
  .overlay .map-wrap { max-height: none; margin-top: 8px; }
  .credits { color: var(--muted); font-size: var(--fs-s); margin: 12px 0 0; }
  .map-pop { position: fixed; z-index: 10; width: 340px; background: var(--color-base-200); border: 1px solid var(--color-neutral); border-radius: var(--radius-box); padding: 12px; box-shadow: 0 8px 30px color-mix(in oklab, var(--color-base-100) 66%, transparent); pointer-events: none; }
  .map-pop .head { color: var(--muted); font-size: var(--fs-s); }
  .map-pop .tiles { grid-template-columns: repeat(3, 1fr); }
  .map-pop .tile img { width: 56px; height: 56px; }
  #result .sub { color: var(--muted); margin: 4px 0 12px; }
  .bars div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bars .bar { flex: 1; height: 10px; background: var(--color-base-200); border-radius: var(--radius-selector); overflow: hidden; }
  .bars .bar i { display: block; height: 100%; }
  .bars .name { width: 100px; }
  .bars .val { width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  .items { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: var(--radius-selector); background: var(--color-base-200); border: 1px solid var(--line); font-size: var(--fs-m); }
  .chip img { width: 28px; height: 28px; object-fit: contain; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  /* Sounds */
  .sound { border: 1px solid var(--line); border-radius: var(--radius-box); padding: 10px; margin-bottom: 10px; }
  .sound.recording { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
  .sound.hit { border-color: var(--accent); }
  .sound-head { display: flex; align-items: center; gap: 8px; }
  .sound-head .grow { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sound .meta { color: var(--muted); font-size: var(--fs-s); margin: 4px 0 8px; }
  .item-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: var(--fs-m); }
  .item-row .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row img { width: 24px; height: 24px; object-fit: contain; background: var(--color-base-100); border-radius: 0; }
  .add-item { display: grid; grid-template-columns: 1fr 96px 74px 50px auto; gap: 6px; margin-top: 8px; }
  details summary { cursor: pointer; font-size: var(--fs-s); }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .size { border: 1px solid var(--line); border-radius: var(--radius-selector); padding: 2px 8px; font-size: var(--fs-m); font-variant-numeric: tabular-nums; }
  .size.on { background: color-mix(in oklab, var(--color-base-content) 8%, transparent); outline: 2px solid var(--text); }
  .odds { margin-top: 12px; }
  .odds-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: var(--fs-m); border-bottom: 1px solid color-mix(in oklab, var(--color-base-content) 4%, transparent); }
  .odds-row .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .odds-row img { width: 24px; height: 24px; object-fit: contain; }
  .odds-row b { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  /* In the app (its own window, no system frame): the header is the title bar */
  .win-ctrls { display: none; }
  body.app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body.app header { flex: none; padding: 8px 8px 8px 20px; user-select: none; }
  body.app .scroll { flex: 1; overflow: auto; }
  body.app .win-ctrls { display: flex; gap: 2px; margin-left: 8px; }
  body.app .map-wrap { max-height: calc(100vh - 210px); }
  #toasts { z-index: 20; }
  #toasts .alert { max-width: 420px; }
  .ic { width: 16px; height: 16px; flex: none; }
  .win-btn.close:hover { background: var(--color-error); color: var(--color-error-content); }
</style>
<script>
// In the app the page's storage starts empty (another browser profile). Once, before anything reads it, it is
// filled from userdata.json: the mirror the browser version kept in its folder, or this app's own after a reinstall.
if (window.__ABI_APP__ && !localStorage.getItem('abi-mh-imported')) {
  try {
    const x = new XMLHttpRequest();
    x.open('GET', 'userdata.json', false);
    x.send();
    if (x.status === 200) for (const [k, v] of Object.entries(JSON.parse(x.responseText).localStorage)) localStorage.setItem(k, v);
  } catch {}
  try { localStorage.setItem('abi-mh-imported', '1'); } catch {}
}
</script>
</head>
<body>
<header data-tauri-drag-region>
  <h1 data-i18n="app" data-tauri-drag-region>ABI: Merchant Helper</h1>
  <button id="btnStart" class="btn btn-sm btn-primary primary" data-i18n="btn.start">Start catching</button>
  <button class="btn btn-sm btn-neutral" id="btnStop" disabled data-i18n="btn.stop">Stop</button>
  <span class="state" id="status" data-i18n="status.idle">Not running</span>
  <span class="spacer" data-tauri-drag-region></span>
  <button class="btn btn-sm btn-neutral" id="btnOverlay" hidden data-i18n="btn.overlay">Open overlay</button>
  <a id="update" class="btn btn-info btn-outline btn-sm update" target="_blank" rel="noopener" hidden></a>
  <div role="tablist" class="tabs tabs-box tabs-sm" id="views">
    <button role="tab" class="tab" id="tabCatch" aria-controls="viewCatch" data-i18n="tab.catch"></button>
    <button role="tab" class="tab" id="tabSetup" aria-controls="viewSetup" data-i18n="tab.setup"></button>
  </div>
  <button id="btnUpdates" class="btn btn-ghost btn-xs ver" hidden></button>
  <div class="win-ctrls">
    <button class="btn btn-ghost btn-sm btn-square win-btn" id="winMin" data-i18n-title="win.min" data-i18n-aria="win.min"><i data-icon="win-min"></i></button>
    <button class="btn btn-ghost btn-sm btn-square win-btn" id="winMax" data-i18n-title="win.max" data-i18n-aria="win.max"><i data-icon="win-max"></i></button>
    <button class="btn btn-ghost btn-sm btn-square win-btn close" id="winClose" data-i18n-title="win.close" data-i18n-aria="win.close"><i data-icon="close"></i></button>
  </div>
</header>
<div class="scroll">

<div id="viewCatch" role="tabpanel" aria-labelledby="tabCatch">
<div class="top">
  <section class="card card-border result-col">
    <h2 data-i18n="h.result">Result</h2>
    <p id="overlayNote" class="muted" hidden data-i18n="overlay.here"></p>
    <div id="result"><span class="muted" data-i18n="result.wait">Waiting for a sound…</span></div>
  </section>

  <section class="card card-border map-col">
    <div class="stage">
      <span class="title" id="stageTitle"></span>
      <span class="grow muted" id="stageHint"></span>
      <button id="btnDone" class="btn btn-sm btn-primary primary" hidden data-i18n="btn.done">Done</button>
      <button class="btn btn-sm btn-ghost" id="btnHow" data-i18n="btn.how"></button>
      <button class="btn btn-sm btn-neutral" id="btnRescan" hidden data-i18n="btn.rescan">Scan again</button>
    </div>
    <div class="map-wrap" id="mapWrap"><canvas id="map" width="360" height="200" tabindex="0" role="application" data-i18n-aria="map.aria"></canvas></div>
    <p class="muted" style="margin:8px 0 0" data-i18n="map.hint"></p>
    <div id="bestBuys"></div>
    <div id="session"></div>
  </section>
</div>
<div id="mapPop" class="map-pop" hidden></div>
</div>
<div id="toasts" class="toast toast-end toast-bottom" aria-live="polite"></div>



<main id="viewSetup" role="tabpanel" aria-labelledby="tabSetup" hidden>
  <div>
    <section class="card card-border">
      <fieldset class="fieldset">
        <legend class="fieldset-legend" data-i18n="set.screen"></legend>
        <div class="row">
          <label><span data-i18n="opt.mode"></span> <select id="mode" class="select select-sm mode" data-i18n-title="mode.title"><option value="second" data-i18n="mode.second">Second screen</option><option value="overlay" data-i18n="mode.overlay">Overlay (one monitor)</option></select></label>
          <label><span data-i18n="opt.uiLang"></span> <select id="lang" class="select select-sm lang" title="Мова · Language · Язык"><option value="uk">UA</option><option value="en">ENG</option><option value="ru">RU</option></select></label>
        </div>
        <p class="label" data-i18n="set.screenHint"></p>
      </fieldset>
    </section>

    <section class="card card-border">
      <fieldset class="fieldset">
        <legend class="fieldset-legend" data-i18n="set.merchant"></legend>
        <div class="row">
          <label><span data-i18n="opt.buys">Purchases per raid</span> <select class="select select-sm" id="buysPerRaid"><option>2</option><option>3</option><option>4</option></select></label>
          <label><span data-i18n="opt.value">Value by</span> <select class="select select-sm" id="valueBasis"><option value="market" data-i18n="value.market">market price</option><option value="trader" data-i18n="value.trader">trader hand-in</option></select></label>
          <label><span data-i18n="opt.gameLang">Game language</span> <select class="select select-sm" id="gameLang"><option value="auto" data-i18n="gameLang.auto">auto</option><option value="eng">English</option><option value="rus">Русский</option></select></label>
        </div>
        <div class="row"><label><input class="checkbox checkbox-sm" type="checkbox" id="alertOn"> <span data-i18n="opt.alert">Alert on a good cargo</span></label></div>
        <p class="label" data-i18n="set.merchantHint"></p>
      </fieldset>
    </section>

    <section class="card card-border">
      <fieldset class="fieldset">
        <legend class="fieldset-legend" data-i18n="h.level"></legend>
        <canvas id="spec" width="800" height="160"></canvas>
        <div class="row" style="margin-top:10px">
          <label><span data-i18n="lbl.sens">Sensitivity</span> <input class="range range-xs" type="range" id="sens" min="4" max="30" value="12"></label>
          <span id="sensVal" class="muted"></span>
          <label><span data-i18n="lbl.thr">Match threshold</span> <input class="range range-xs" type="range" id="thr" min="30" max="95" value="50"></label>
          <span id="thrVal" class="muted"></span>
          <label><input class="checkbox checkbox-sm" type="checkbox" id="beep" checked> <span data-i18n="lbl.beep">Beep</span></label>
        </div>
        <p class="label" data-i18n="set.soundHint"></p>
      </fieldset>
    </section>

    <section class="card card-border">
      <h2 data-i18n="h.log">Log</h2>
      <div id="log"></div>
    </section>
  </div>

  <div>
    <section class="card card-border">
      <h2 data-i18n="h.sounds">Sounds</h2>
      <div class="row">
        <button id="btnLib" class="btn btn-sm btn-primary primary" data-i18n="btn.lib">Import library</button>
        <select class="select select-sm" id="profile" hidden data-i18n-title="tip.profile"></select>
        <label data-i18n-title="tip.blue"><input class="checkbox checkbox-sm" type="checkbox" id="blue"> <span data-i18n="lbl.blue">Blue</span></label>
        <input type="file" id="libDir" webkitdirectory hidden>
      </div>
      <div class="row">
        <input class="input input-sm" type="text" id="newName" data-i18n-ph="ph.newName" style="flex:1">
        <button class="btn btn-sm btn-neutral" id="btnAdd" data-i18n="btn.add">Add</button>
      </div>
      <div id="sounds"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-sm btn-neutral" id="btnExport" data-i18n="btn.export">Export</button>
        <button class="btn btn-sm btn-neutral" id="btnImport" data-i18n="btn.import">Import</button>
        <button id="btnClear" class="btn btn-sm btn-error btn-outline danger" data-i18n="btn.clear">Clear all</button>
        <input type="file" id="file" accept=".json" hidden>
        <input type="file" id="imgFile" accept="image/*" hidden>
      </div>
    </section>

    <section class="card card-border" id="help">
      <h2 data-i18n="h.help">How to use</h2>
      <ol class="help">
        <li data-i18n-html="help.1"></li>
        <li data-i18n-html="help.2"></li>
        <li data-i18n-html="help.3"></li>
        <li data-i18n-html="help.4"></li>
        <li data-i18n-html="help.5"></li>
        <li data-i18n-html="help.6"></li>
        <li data-i18n-html="help.7"></li>
        <li data-i18n-html="help.8"></li>
      </ol>
      <p class="muted" data-i18n="help.note"></p>
      <p class="credits">Created by neverh8me and Claude Code</p>
    </section>
  </div>
</main>

<video id="video" autoplay muted playsinline hidden></video>

</div>
<script src="i18n.js"></script>
<script src="audio.js"></script>
<script src="library.js"></script>
<script src="vision.js"></script>
<script src="lib/tesseract/tesseract.min.js"></script>
<script src="ocr.js"></script>
<script src="lib/icons.js"></script>
<script src="js/base.js"></script>
<script src="js/capture.js"></script>
<script src="js/recognition.js"></script>
<script src="js/odds.js"></script>
<script src="js/screen.js"></script>
<script src="js/purchases.js"></script>
<script src="js/map.js"></script>
<script src="js/sounds.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/main.js"></script>
</body>
</html>
