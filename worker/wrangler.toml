# Deploy from this folder: npx wrangler deploy (the GITHUB_TOKEN secret stays as it is)
name = "abi-kaluvan"
main = "worker.js"
compatibility_date = "2026-10-01"

# At most 3 requests per IP per minute (Cloudflare allows a period of 10 or 60 seconds only)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
