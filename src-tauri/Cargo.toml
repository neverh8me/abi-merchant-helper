[package]
name = "abi-merchant-helper"
version = "3.1.0"
edition = "2024"
description = "Field Merchant cargo helper for Arena Breakout: Infinite"
license = "GPL-3.0-only"
repository = "https://github.com/neverh8me/abi-merchant-helper"

[lib]
name = "abi_merchant_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
jpeg-encoder = { version = "0.6", features = ["simd"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
wasapi = "0.27"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
