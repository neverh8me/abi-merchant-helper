<!doctype html>
<html lang="en" data-theme="abi">
<head>
<meta charset="utf-8">
<title>ABI: Merchant Helper</title>
<link rel="stylesheet" href="daisyui.css">
<link rel="stylesheet" href="abi-theme.css">
<style>
  /* The start screen: update, base sync, then the app. daisyUI components; only the layout is ours. */
  html, body { height: 100%; }
  body { margin: 0; background: var(--color-base-100); color: var(--color-base-content); display: flex; flex-direction: column; overflow: hidden; user-select: none; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; font-size: 13px; }
  #bar .grow { flex: 1; align-self: stretch; }
  #close:hover { background: #e5173a; color: #fff; }
  main { flex: 1; display: grid; place-items: center; padding: 24px; }
  .card { width: min(520px, 100%); background: var(--color-base-200); }
  .card-actions { justify-content: flex-end; }
  [hidden] { display: none !important; }
  .steps, .progress { width: 100%; }
  .step { text-align: start; }
  .detail { font-size: 12px; opacity: .65; min-height: 17px; user-select: text; }
  #notes { margin-top: 8px; max-height: 120px; overflow: auto; white-space: pre-wrap; font-size: 12px; opacity: .65; user-select: text; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
</style>
</head>
<body>
<div id="bar" data-tauri-drag-region>
  <b data-tauri-drag-region>ABI: Merchant Helper</b><span id="ver" class="badge badge-ghost badge-sm" data-tauri-drag-region></span>
  <span class="grow" data-tauri-drag-region></span>
  <button class="btn btn-ghost btn-sm btn-square" id="min"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
  <button class="btn btn-ghost btn-sm btn-square" id="max"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg></button>
  <button class="btn btn-ghost btn-sm btn-square" id="close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>
<main>
  <div class="card card-border">
    <div class="card-body">
      <h1 class="card-title" id="title"></h1>
      <p id="sub"></p>
      <ul class="steps steps-vertical">
        <li class="step" id="s-upd"><div><div class="name"></div><div class="detail"></div><progress class="progress progress-primary" value="0" max="100" hidden></progress><div id="notes" hidden></div></div></li>
        <li class="step" id="s-base"><div><div class="name"></div><div class="detail"></div></div></li>
        <li class="step" id="s-app"><div><div class="name"></div><div class="detail"></div></div></li>
      </ul>
      <div class="card-actions">
        <button class="btn btn-neutral" id="again" hidden></button>
        <button class="btn btn-primary" id="open" hidden></button>
      </div>
    </div>
  </div>
</main>
<script>

const T = {
  en: { title: 'Getting ready', menu: 'Updates', sub: 'Version {v}', upd: 'App update', base: 'Purchase base', app: 'Start',
    checking: 'Checking…', latest: 'You have the latest version.', found: 'Version {v} found, downloading…', dl: 'Downloading {p}% ({a} of {b} MB)', installing: 'Installing, the app will restart…',
    offline: 'Could not check (offline?): {e}', syncing: 'Merging with the shared base…', synced: 'Purchases in the base: {n}. Sent yours: {s}.', syncedOff: 'No connection, using the local copy ({n} purchases).',
    opening: 'Opening…', ready: 'Ready.', busy: 'The address localhost:8777 is taken. An older ABI: Merchant Helper is probably still running: close it and try again.',
    again: 'Check again', open: 'Open the app', back: 'Back to the app', min: 'Minimize', max: 'Maximize', close: 'Close' },
  uk: { title: 'Готуємось', menu: 'Оновлення', sub: 'Версія {v}', upd: 'Оновлення програми', base: 'База покупок', app: 'Запуск',
    checking: 'Перевіряю…', latest: 'У вас найновіша версія.', found: 'Знайдено версію {v}, завантажую…', dl: 'Завантаження {p}% ({a} з {b} МБ)', installing: 'Встановлюю, програма перезапуститься…',
    offline: 'Не вдалося перевірити (немає мережі?): {e}', syncing: 'Зливаю зі спільною базою…', synced: 'Покупок у базі: {n}. Надіслано ваших: {s}.', syncedOff: 'Немає зв’язку, беру локальну копію ({n} покупок).',
    opening: 'Відкриваю…', ready: 'Готово.', busy: 'Адреса localhost:8777 зайнята. Мабуть, ще працює стара ABI: Merchant Helper: закрийте її і спробуйте знову.',
    again: 'Перевірити знову', open: 'Відкрити програму', back: 'Назад до програми', min: 'Згорнути', max: 'Розгорнути', close: 'Закрити' },
  ru: { title: 'Готовимся', menu: 'Обновления', sub: 'Версия {v}', upd: 'Обновление программы', base: 'База покупок', app: 'Запуск',
    checking: 'Проверяю…', latest: 'У вас последняя версия.', found: 'Найдена версия {v}, загружаю…', dl: 'Загрузка {p}% ({a} из {b} МБ)', installing: 'Устанавливаю, программа перезапустится…',
    offline: 'Не удалось проверить (нет сети?): {e}', syncing: 'Объединяю с общей базой…', synced: 'Покупок в базе: {n}. Отправлено ваших: {s}.', syncedOff: 'Нет связи, беру локальную копию ({n} покупок).',
    opening: 'Открываю…', ready: 'Готово.', busy: 'Адрес localhost:8777 занят. Видимо, ещё работает старая ABI: Merchant Helper: закройте её и попробуйте снова.',
    again: 'Проверить снова', open: 'Открыть программу', back: 'Назад в программу', min: 'Свернуть', max: 'Развернуть', close: 'Закрыть' },
};
const lang = new URLSearchParams(location.search).get('lang') || navigator.language.slice(0, 2);
const S = T[lang] || T.en;
const t = (k, v = {}) => S[k].replace(/\{(\w+)\}/g, (_, n) => v[n]);
const $ = id => document.getElementById(id);
const { invoke } = window.__TAURI__.core;
const win = window.__TAURI__.window.getCurrentWindow();
const menu = new URLSearchParams(location.search).has('menu'); // opened from the app: stay here until "Back"

document.documentElement.lang = S === T.en ? 'en' : lang;
$('min').onclick = () => win.minimize();
$('max').onclick = () => win.toggleMaximize();
$('close').onclick = () => win.close();
for (const id of ['min', 'max', 'close']) $(id).title = t(id);
$('title').textContent = t(menu ? 'menu' : 'title');
for (const [id, k] of [['s-upd', 'upd'], ['s-base', 'base'], ['s-app', 'app']]) $(id).querySelector('.name').textContent = t(k);
$('again').textContent = t('again');
$('again').onclick = () => location.reload();

function step(id, state, detail) {
  const li = $(id);
  li.className = 'step ' + ({ run: 'step-primary', ok: 'step-success', err: 'step-error' }[state] || '');
  li.querySelector('.detail').textContent = detail || '';
}

window.__TAURI__.event.listen('update-progress', e => {
  const { downloaded, total } = e.payload, mb = n => (n / 1048576).toFixed(1);
  const p = total ? Math.round(downloaded / total * 100) : 0;
  $('s-upd').querySelector('progress').value = p;
  step('s-upd', 'run', downloaded >= total && total ? t('installing') : t('dl', { p, a: mb(downloaded), b: total ? mb(total) : '?' }));
});

async function run() {
  const info = await invoke('app_info');
  $('ver').textContent = 'v' + info.version;
  $('sub').textContent = t('sub', { v: info.version });

  step('s-upd', 'run', t('checking'));
  try {
    const u = await invoke('check_update');
    if (u.available) {
      step('s-upd', 'run', t('found', { v: u.version }));
      $('s-upd').querySelector('progress').hidden = false;
      if (u.notes) { $('notes').textContent = u.notes; $('notes').hidden = false; }
      await invoke('install_update'); // the app restarts when it is done
      return;
    }
    step('s-upd', 'ok', t('latest'));
  } catch (e) { step('s-upd', 'err', t('offline', { e })); }

  step('s-base', 'run', t('syncing'));
  try {
    const r = await invoke('sync_base');
    step('s-base', 'ok', r.online ? t('synced', { n: r.total, s: r.sent }) : t('syncedOff', { n: r.total }));
  } catch (e) { step('s-base', 'err', String(e)); }

  if (info.error) { step('s-app', 'err', t('busy')); $('again').hidden = false; return; }
  const open = () => location.replace(info.url);
  if (menu) {
    step('s-app', 'ok', t('ready'));
    $('again').hidden = false;
    $('open').textContent = t('back'); $('open').hidden = false; $('open').onclick = open;
    return;
  }
  step('s-app', 'run', t('opening'));
  setTimeout(open, 500); // long enough to see what was done
}
run().catch(e => { step('s-app', 'err', String(e)); $('again').hidden = false; });
</script>
</body>
</html>
